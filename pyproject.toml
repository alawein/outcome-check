[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outcome-check"
version = "0.3.0"
description = "Compare requested outcomes with supplied state evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=44"]

[project.scripts]
outcome-check = "outcome_check.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "hypothesis>=6",
    "jsonschema>=4",
    "mypy>=1",
    "cryptography>=44",
    "build>=1.6.1",
    "twine>=7.0.0",
    "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/outcome_check"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: needs the network or takes more than a few seconds"]

[tool.mypy]
check_untyped_defs = true
