# Class: tool in Python, or lab (uv or pip projects with ruff and pytest).
# Copy to .github/workflows/ci.yml in the repo.
#
# The pin after "@" must be a full 40-character commit SHA of alawein/.github.
# To update it: find the new SHA (gh api repos/alawein/.github/commits/main --jq .sha),
# replace all pins in this file at once, and open a PR. Steps are in docs/ci.md, "Bump a pin".
#
# Required checks for the ruleset: markdown-lint, link-check, actionlint, pr-title, python-ci

name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-markdown-lint:
    uses: alawein/.github/.github/workflows/lint-markdown.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-actionlint:
    uses: alawein/.github/.github/workflows/lint-actions.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-pr-title:
    permissions:
      pull-requests: read
    uses: alawein/.github/.github/workflows/pr-title.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-python-ci:
    uses: alawein/.github/.github/workflows/python-ci.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main
    with:
      python-version: "3.13"
      installer: uv

  # Gate jobs: a called job reports as "<caller job> / <called job>", so these carry the exact
  # check names the ruleset requires.
  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"

  pr-title:
    needs: [run-pr-title]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      # Only the actual main-push event may omit PR-title evaluation.
      - name: Require success or eligible main-push skip
        env:
          RESULT: ${{ needs.run-pr-title.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          [ "$RESULT" = "success" ] || {
            [ "$RESULT" = "skipped" ] && [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]
          }

  python-ci:
    needs: [run-python-ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-python-ci.result }}
        run: test "$RESULT" = "success"


  product-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.5"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/validate_schemas.py
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - name: Report dependency audit
        continue-on-error: true
        run: uv run pip-audit --local
